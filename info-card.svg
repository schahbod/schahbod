<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Shahbod data engineering dashboard header">
	<style>
		.mono{font-family:ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace}
		.sans{font-family:'Segoe UI','Space Grotesk',Arial,sans-serif}
		.fade-in{opacity:0;transform:translateY(4px);animation:fade-in .7s ease-out forwards}
		.chip{fill:#121826;stroke:#2A3241;stroke-width:1}
		.chip-t{font-size:12px;font-weight:600}
		.tiny{font-size:10px;letter-spacing:1.4px}
		.metric{font-size:11px;letter-spacing:1.1px}
		.pulse{animation:pulse 3.4s ease-in-out infinite}
		.status{opacity:0;animation:appear .6s ease-out forwards}
		.brick{opacity:.14;animation:brick 5.8s ease-in-out infinite}
		.flow{stroke-dasharray:4 7;animation:flow 11s linear infinite}
		@keyframes fade-in{to{opacity:1;transform:none}}
		@keyframes pulse{0%,100%{r:6.5;opacity:1}50%{r:7.7;opacity:.84}}
		@keyframes appear{to{opacity:1}}
		@keyframes brick{0%,100%{opacity:.12}50%{opacity:.34}}
		@keyframes flow{to{stroke-dashoffset:-180}}
	</style>

	<!-- definitions -->
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#0A0D13"/>
			<stop offset="100%" stop-color="#121826"/>
		</linearGradient>
		<linearGradient id="flowGrad" x1="620" y1="138" x2="1120" y2="138" gradientUnits="userSpaceOnUse">
			<stop offset="0%" stop-color="#4FD1C5" stop-opacity="0.28"/>
			<stop offset="50%" stop-color="#F2B84B" stop-opacity="0.82"/>
			<stop offset="100%" stop-color="#4FD1C5" stop-opacity="0.28"/>
		</linearGradient>
		<radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#F2B84B" stop-opacity="0.32"/>
			<stop offset="100%" stop-color="#F2B84B" stop-opacity="0"/>
		</radialGradient>
		<pattern id="dotGrid" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
			<circle cx="1" cy="1" r="1" fill="#2A3241" fill-opacity="0.23"/>
		</pattern>
		<filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="6"/>
		</filter>
	</defs>

	<!-- background -->
	<rect x="0" y="0" width="1200" height="260" rx="18" fill="url(#bg)"/>
	<rect x="0" y="0" width="1200" height="260" rx="18" fill="url(#dotGrid)"/>
	<ellipse cx="890" cy="80" rx="180" ry="72" fill="url(#amberGlow)" filter="url(#softBlur)"/>

	<!-- dashboard separators and micro-grid -->
	<line x1="580" y1="22" x2="580" y2="238" stroke="#2A3241" stroke-opacity="0.7"/>
	<line x1="24" y1="62" x2="556" y2="62" stroke="#1E2530"/>
	<line x1="604" y1="62" x2="1176" y2="62" stroke="#1E2530"/>
	<line x1="604" y1="206" x2="1176" y2="206" stroke="#1E2530"/>
	<line x1="604" y1="102" x2="1176" y2="102" stroke="#1E2530" stroke-dasharray="2 8"/>

	<!-- header -->
	<g class="fade-in" style="animation-delay:0.08s">
		<text x="40" y="42" class="mono tiny" fill="#4FD1C5">DATA &amp; PROCESS ENGINEERING</text>
		<text x="40" y="95" class="sans" font-size="44" font-weight="700" fill="#EDF1F7">Shahbod</text>
		<text x="40" y="122" class="sans" font-size="19" fill="#9AA4B2">Data &amp; Process Analyst</text>
		<text x="40" y="146" class="mono metric" fill="#F2B84B">AUTOMATION · DISTRIBUTED DATA · ANALYTICS</text>
		<text x="40" y="170" class="sans" font-size="15" fill="#9AA4B2">Building pipelines and automation for reliable, well-governed data</text>
	</g>

	<!-- technology chips -->
	<g class="fade-in" style="animation-delay:0.24s">
		<rect class="chip" x="40" y="192" width="102" height="30" rx="15"/><text x="72" y="211" class="mono chip-t" fill="#4FD1C5">Python</text>
		<rect class="chip" x="152" y="192" width="104" height="30" rx="15"/><text x="184" y="211" class="mono chip-t" fill="#F2B84B">Docker</text>
		<rect class="chip" x="266" y="192" width="108" height="30" rx="15"/><text x="295" y="211" class="mono chip-t" fill="#4FD1C5">Airflow</text>
		<rect class="chip" x="384" y="192" width="132" height="30" rx="15"/><text x="410" y="211" class="mono chip-t" fill="#F2B84B">PostgreSQL</text>

		<rect class="chip" x="96" y="226" width="90" height="24" rx="12"/><text x="126" y="242" class="mono" font-size="11" font-weight="600" fill="#4FD1C5">Citus</text>
		<rect class="chip" x="198" y="226" width="112" height="24" rx="12"/><text x="224" y="242" class="mono" font-size="11" font-weight="600" fill="#F2B84B">Superset</text>
	</g>

	<!-- data-brick visualization -->
	<g class="fade-in" style="animation-delay:0.32s">
		<text x="784" y="40" class="mono tiny" fill="#7C8695">DENSITY MATRIX</text>
		<g transform="translate(780 46)">
			<rect class="brick" x="0" y="0" width="10" height="8" rx="2" fill="#4FD1C5" style="animation-delay:.1s"/>
			<rect class="brick" x="14" y="0" width="10" height="8" rx="2" fill="#F2B84B" style="animation-delay:.3s"/>
			<rect class="brick" x="28" y="0" width="10" height="8" rx="2" fill="#4FD1C5" style="animation-delay:.7s"/>
			<rect class="brick" x="42" y="0" width="10" height="8" rx="2" fill="#4FD1C5" style="animation-delay:.2s"/>
			<rect class="brick" x="56" y="0" width="10" height="8" rx="2" fill="#F2B84B" style="animation-delay:1s"/>
			<rect class="brick" x="84" y="0" width="10" height="8" rx="2" fill="#4FD1C5" style="animation-delay:.6s"/>
			<rect class="brick" x="98" y="0" width="10" height="8" rx="2" fill="#F2B84B" style="animation-delay:1.3s"/>
			<rect class="brick" x="112" y="0" width="10" height="8" rx="2" fill="#4FD1C5" style="animation-delay:.4s"/>
			<rect class="brick" x="126" y="0" width="10" height="8" rx="2" fill="#F2B84B" style="animation-delay:.9s"/>
			<rect class="brick" x="140" y="0" width="10" height="8" rx="2" fill="#4FD1C5" style="animation-delay:1.1s"/>

			<rect class="brick" x="0" y="12" width="10" height="8" rx="2" fill="#F2B84B" style="animation-delay:1.2s"/>
			<rect class="brick" x="14" y="12" width="10" height="8" rx="2" fill="#4FD1C5" style="animation-delay:.2s"/>
			<rect class="brick" x="42" y="12" width="10" height="8" rx="2" fill="#F2B84B" style="animation-delay:.8s"/>
			<rect class="brick" x="56" y="12" width="10" height="8" rx="2" fill="#4FD1C5" style="animation-delay:1.4s"/>
			<rect class="brick" x="70" y="12" width="10" height="8" rx="2" fill="#F2B84B" style="animation-delay:.5s"/>
			<rect class="brick" x="84" y="12" width="10" height="8" rx="2" fill="#4FD1C5" style="animation-delay:.1s"/>
			<rect class="brick" x="98" y="12" width="10" height="8" rx="2" fill="#4FD1C5" style="animation-delay:1.6s"/>
			<rect class="brick" x="126" y="12" width="10" height="8" rx="2" fill="#F2B84B" style="animation-delay:.3s"/>
			<rect class="brick" x="140" y="12" width="10" height="8" rx="2" fill="#4FD1C5" style="animation-delay:.95s"/>

			<rect class="brick" x="14" y="24" width="10" height="8" rx="2" fill="#4FD1C5" style="animation-delay:.7s"/>
			<rect class="brick" x="28" y="24" width="10" height="8" rx="2" fill="#F2B84B" style="animation-delay:1.1s"/>
			<rect class="brick" x="42" y="24" width="10" height="8" rx="2" fill="#4FD1C5" style="animation-delay:.4s"/>
			<rect class="brick" x="56" y="24" width="10" height="8" rx="2" fill="#F2B84B" style="animation-delay:1.7s"/>
			<rect class="brick" x="70" y="24" width="10" height="8" rx="2" fill="#4FD1C5" style="animation-delay:.2s"/>
			<rect class="brick" x="98" y="24" width="10" height="8" rx="2" fill="#F2B84B" style="animation-delay:1s"/>
			<rect class="brick" x="112" y="24" width="10" height="8" rx="2" fill="#4FD1C5" style="animation-delay:1.3s"/>
			<rect class="brick" x="126" y="24" width="10" height="8" rx="2" fill="#4FD1C5" style="animation-delay:.45s"/>
		</g>
	</g>

	<!-- pipeline -->
	<g class="fade-in" style="animation-delay:0.44s">
		<text x="608" y="42" class="mono tiny" fill="#7C8695">DATA PLATFORM FLOW</text>
		<line x1="650" y1="138" x2="1120" y2="138" class="flow" stroke="url(#flowGrad)" stroke-width="2" stroke-linecap="round"/>

		<g>
			<circle cx="660" cy="138" r="6.5" fill="#4FD1C5" class="pulse" style="animation-delay:0s"/>
			<text x="636" y="118" class="mono tiny" fill="#9AA4B2">SOURCE</text>
			<text x="620" y="158" class="mono" font-size="13" font-weight="600" fill="#EDF1F7">PostgreSQL</text>
		</g>
		<g>
			<circle cx="775" cy="138" r="6.5" fill="#F2B84B" class="pulse" style="animation-delay:.35s"/>
			<text x="742" y="118" class="mono tiny" fill="#9AA4B2">TRANSFORM</text>
			<text x="756" y="158" class="mono" font-size="13" font-weight="600" fill="#EDF1F7">Python</text>
		</g>
		<g>
			<circle cx="890" cy="138" r="6.5" fill="#4FD1C5" class="pulse" style="animation-delay:.7s"/>
			<text x="847" y="118" class="mono tiny" fill="#9AA4B2">ORCHESTRATE</text>
			<text x="868" y="158" class="mono" font-size="13" font-weight="600" fill="#EDF1F7">Airflow</text>
		</g>
		<g>
			<circle cx="1005" cy="138" r="6.5" fill="#F2B84B" class="pulse" style="animation-delay:1.05s"/>
			<text x="972" y="118" class="mono tiny" fill="#9AA4B2">DISTRIBUTE</text>
			<text x="991" y="158" class="mono" font-size="13" font-weight="600" fill="#EDF1F7">Citus</text>
		</g>
		<g>
			<circle cx="1120" cy="138" r="6.5" fill="#4FD1C5" class="pulse" style="animation-delay:1.4s"/>
			<text x="1087" y="118" class="mono tiny" fill="#9AA4B2">VISUALIZE</text>
			<text x="1095" y="158" class="mono" font-size="13" font-weight="600" fill="#EDF1F7">Superset</text>
		</g>
	</g>

	<!-- status indicators -->
	<g class="mono" font-size="10" fill="#7C8695">
		<g class="status" style="animation-delay:0.85s"><circle cx="644" cy="178" r="3" fill="#4FD1C5"/><text x="652" y="181">CONNECTED</text></g>
		<g class="status" style="animation-delay:1.02s"><circle cx="762" cy="178" r="3" fill="#F2B84B"/><text x="770" y="181">ACTIVE</text></g>
		<g class="status" style="animation-delay:1.19s"><circle cx="876" cy="178" r="3" fill="#4FD1C5"/><text x="884" y="181">RUNNING</text></g>
		<g class="status" style="animation-delay:1.36s"><circle cx="988" cy="178" r="3" fill="#F2B84B"/><text x="996" y="181">DISTRIBUTED</text></g>
		<g class="status" style="animation-delay:1.53s"><circle cx="1104" cy="178" r="3" fill="#4FD1C5"/><text x="1112" y="181">ONLINE</text></g>
	</g>

	<!-- border -->
	<rect x="1" y="1" width="1198" height="258" rx="17" fill="none" stroke="#2A3241"/>
</svg>