<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Selected projects dashboard">
  <style>
    .mono{font-family:ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace}
    .sans{font-family:'Segoe UI','Space Grotesk',Arial,sans-serif}
    .fade{opacity:0;transform:translateY(5px);animation:fade .65s ease-out forwards}
    .card{fill:#121826;stroke:#2A3241;stroke-width:1}
    .tiny{font-size:10px;letter-spacing:1.4px}
    .label{font-size:12px;letter-spacing:1px}
    .title{font-size:20px;font-weight:700}
    .body{font-size:14px;fill:#9AA4B2}
    .stack{font-size:12px;font-weight:600}
    @keyframes fade{to{opacity:1;transform:none}}
  </style>

  <!-- definitions -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0D13"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <pattern id="dotGrid" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2A3241" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="430" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="430" rx="18" fill="url(#dotGrid)"/>

  <!-- header -->
  <g class="fade" style="animation-delay:.05s">
    <text x="40" y="44" class="mono tiny" fill="#4FD1C5">PROJECTS</text>
    <text x="1160" y="44" text-anchor="end" class="mono tiny" fill="#F2B84B">04 SELECTED</text>
    <line x1="40" y1="60" x2="1160" y2="60" stroke="#1E2530"/>
  </g>

  <!-- project cards row 1 -->
  <g class="fade" style="animation-delay:.16s">
    <rect class="card" x="50" y="84" width="525" height="152" rx="10"/>
    <text x="72" y="108" class="mono label" fill="#7C8695">01</text>
    <text x="72" y="132" class="mono tiny" fill="#4FD1C5">DATA VISUALIZATION</text>
    <text x="72" y="160" class="sans title" fill="#EDF1F7">Superset KPI Card</text>
    <text x="72" y="187" class="sans body">Custom visualization plugin for Apache</text>
    <text x="72" y="207" class="sans body">Superset.</text>
    <text x="72" y="225" class="mono stack" fill="#4FD1C5">TypeScript / React / Data Visualization</text>

    <rect class="card" x="625" y="84" width="525" height="152" rx="10"/>
    <text x="647" y="108" class="mono label" fill="#7C8695">02</text>
    <text x="647" y="132" class="mono tiny" fill="#F2B84B">DISTRIBUTED DATA</text>
    <text x="647" y="160" class="sans title" fill="#EDF1F7">PostgreSQL / Citus</text>
    <text x="647" y="187" class="sans body">Distributed PostgreSQL infrastructure</text>
    <text x="647" y="207" class="sans body">and processing.</text>
    <text x="647" y="225" class="mono stack" fill="#F2B84B">PostgreSQL / Citus / Docker</text>
  </g>

  <!-- project cards row 2 -->
  <g class="fade" style="animation-delay:.28s">
    <rect class="card" x="50" y="254" width="525" height="152" rx="10"/>
    <text x="72" y="278" class="mono label" fill="#7C8695">03</text>
    <text x="72" y="302" class="mono tiny" fill="#4FD1C5">PROCESS AUTOMATION</text>
    <text x="72" y="330" class="sans title" fill="#EDF1F7">Data Warehouse Automation</text>
    <text x="72" y="357" class="sans body">Automation and optimization of warehouse</text>
    <text x="72" y="377" class="sans body">processes.</text>
    <text x="72" y="395" class="mono stack" fill="#4FD1C5">Python / SQL / Airflow</text>

    <rect class="card" x="625" y="254" width="525" height="152" rx="10"/>
    <text x="647" y="278" class="mono label" fill="#7C8695">04</text>
    <text x="647" y="302" class="mono tiny" fill="#F2B84B">DATA ANALYTICS</text>
    <text x="647" y="330" class="sans title" fill="#EDF1F7">Data Analysis</text>
    <text x="647" y="357" class="sans body">Data analysis and visualization projects.</text>
    <text x="647" y="377" class="sans body">Built for practical insights and reporting.</text>
    <text x="647" y="395" class="mono stack" fill="#F2B84B">Python / SQL / Pandas</text>
  </g>

  <!-- border -->
  <rect x="1" y="1" width="1198" height="428" rx="17" fill="none" stroke="#2A3241"/>
</svg>
